<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주행게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
            touch-action: manipulation;
            user-select: none;
        }
        #canvasContainer {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-center items-center overflow-hidden p-2">

    <!-- Game Container -->
    <div class="relative w-full max-w-md h-[90vh] max-h-[800px] bg-slate-900 rounded-3xl overflow-hidden border-4 border-slate-800 shadow-2xl flex flex-col justify-between">
        
        <!-- Top HUD Panel -->
        <div class="absolute top-0 left-0 right-0 z-10 p-4 bg-gradient-to-b from-slate-950/90 to-transparent pointer-events-none flex justify-between items-start">
            <!-- Score & Speed -->
            <div>
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold">SCORE</div>
                <div id="scoreDisplay" class="text-3xl font-black text-amber-400 drop-shadow">0</div>
                <div id="speedDisplay" class="text-xs font-bold text-sky-400 mt-1">속도: 100 km/h</div>
            </div>

            <!-- Fuel Bar HUD -->
            <div class="w-36 bg-slate-900/80 border border-slate-700/80 p-2 rounded-2xl backdrop-blur-md">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-slate-300 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5 text-emerald-400 inline" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"></path>
                            <path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"></path>
                        </svg>
                        연료
                    </span>
                    <span id="fuelText" class="text-xs font-extrabold text-emerald-400">10.0초</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
                    <div id="fuelBar" class="bg-gradient-to-r from-emerald-500 to-green-400 h-full w-full transition-all duration-75"></div>
                </div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full h-full flex-grow overflow-hidden">
            <div id="canvasContainer" class="w-full h-full"></div>
            
            <!-- Visual Effect Overlay for Fuel Pickups -->
            <div id="screenFlash" class="absolute inset-0 bg-emerald-500/20 opacity-0 pointer-events-none transition-opacity duration-200 z-10"></div>
        </div>

        <!-- Touch Controls (Mobile Friendly) -->
        <div class="absolute bottom-4 inset-x-4 z-10 flex justify-between gap-4 pointer-events-auto md:hidden">
            <button id="btnLeft" class="flex-1 bg-slate-800/80 hover:bg-slate-700 active:bg-amber-500/80 border border-slate-600 rounded-2xl py-4 text-center font-black text-2xl text-white backdrop-blur shadow-lg active:scale-95 transition-transform">
                ◀
            </button>
            <button id="btnRight" class="flex-1 bg-slate-800/80 hover:bg-slate-700 active:bg-amber-500/80 border border-slate-600 rounded-2xl py-4 text-center font-black text-2xl text-white backdrop-blur shadow-lg active:scale-95 transition-transform">
                ▶
            </button>
        </div>

        <!-- Start / Game Over Overlay Modal -->
        <div id="overlay" class="absolute inset-0 z-20 bg-slate-950/90 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center">
            <!-- Title Graphic -->
            <div id="titleContainer">
                <div class="inline-block bg-amber-500 text-slate-950 font-black text-xs px-3 py-1 rounded-full mb-3 tracking-widest uppercase shadow">5-LANE 3D DRIVE</div>
                <h1 class="text-4xl font-black tracking-tight text-white mb-2">주행게임</h1>
                <p class="text-sm text-slate-400 max-w-xs mb-6">장애물과 사슴을 피하고 길 위의 <span class="text-emerald-400 font-bold">연료</span>를 먹으며 달려라!</p>
            </div>

            <!-- Rules Card -->
            <div id="rulesCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-xs mb-6 text-left text-xs text-slate-300 space-y-2">
                <div class="flex items-center gap-2">
                    <span class="bg-sky-500/20 text-sky-400 p-1 rounded font-bold">조작</span>
                    <span>좌우 화살표키 / A, D 키 / 하단 버튼</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-amber-500/20 text-amber-400 p-1 rounded font-bold">점수</span>
                    <span>1초 달릴 때마다 +100점</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-500/20 text-emerald-400 p-1 rounded font-bold">연료</span>
                    <span>시작 10초 (초당 -0.5초), 획득시 +1.0초</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-rose-500/20 text-rose-400 p-1 rounded font-bold">장애물</span>
                    <span>차량, 사슴, 새, 보행자 & 30초 후 공사 구멍!</span>
                </div>
            </div>

            <!-- Final Result Box -->
            <div id="resultBox" class="hidden mb-6">
                <div id="gameOverReason" class="text-rose-400 font-bold text-sm mb-1">장애물과 충돌했습니다!</div>
                <div class="text-xs text-slate-400 uppercase tracking-widest">최종 점수</div>
                <div id="finalScore" class="text-5xl font-black text-amber-400 my-2">0</div>
            </div>

            <!-- Start/Restart Button -->
            <button id="startBtn" class="w-full max-w-xs bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black text-lg py-4 rounded-2xl shadow-lg shadow-orange-500/20 active:scale-95 transition-all cursor-pointer">
                주행 시작하기
            </button>
        </div>

    </div>

    <!-- Web Audio Engine -->
    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playFuel() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playCrash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }
        const sfx = new SoundEffects();
    </script>

    <!-- Main Game Engine -->
    <script>
        const container = document.getElementById('canvasContainer');

        const overlay = document.getElementById('overlay');
        const titleContainer = document.getElementById('titleContainer');
        const rulesCard = document.getElementById('rulesCard');
        const resultBox = document.getElementById('resultBox');
        const gameOverReason = document.getElementById('gameOverReason');
        const finalScore = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const speedDisplay = document.getElementById('speedDisplay');
        const fuelBar = document.getElementById('fuelBar');
        const fuelText = document.getElementById('fuelText');
        const screenFlash = document.getElementById('screenFlash');

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        let scene, camera, renderer;
        let playerMesh;
        let roadGroup, roadLines = [];

        const LANE_X = [-4.8, -2.4, 0, 2.4, 4.8];
        const MAX_FUEL = 10.0;
        const ROAD_LENGTH = 120;
        
        let gameState = 'INIT';
        let currentLane = 2;
        let targetX = 0;
        let fuel = MAX_FUEL;
        let score = 0;
        let elapsedTime = 0;
        let baseSpeed = 10;
        let currentSpeedMultiplier = 1;
        
        let obstacles = [];
        let fuelItems = [];

        let lastTimestamp = 0;
        let obstacleSpawnTimer = 0;
        let pedestrianSpawnTimer = 0;
        let fuelSpawnTimer = 0;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.018);

            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 16, 20);
            camera.lookAt(0, 1, -12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            buildRoad();
            createPlayerCar();

            window.addEventListener('resize', onWindowResize);
            renderer.render(scene, camera);
        }

        function buildRoad() {
            roadGroup = new THREE.Group();

            const roadGeo = new THREE.PlaneGeometry(14.5, ROAD_LENGTH);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -ROAD_LENGTH / 2 + 10;
            road.receiveShadow = true;
            roadGroup.add(road);

            const curbGeo = new THREE.BoxGeometry(0.4, 0.4, ROAD_LENGTH);
            const curbMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
            const leftCurb = new THREE.Mesh(curbGeo, curbMat);
            leftCurb.position.set(-7.2, 0.2, -ROAD_LENGTH / 2 + 10);
            const rightCurb = new THREE.Mesh(curbGeo, curbMat);
            rightCurb.position.set(7.2, 0.2, -ROAD_LENGTH / 2 + 10);
            roadGroup.add(leftCurb, rightCurb);

            const lineGeo = new THREE.BoxGeometry(0.12, 0.05, 2.5);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0x64748b });
            const linePositionsX = [-3.6, -1.2, 1.2, 3.6];

            for (let z = 10; z > -ROAD_LENGTH + 10; z -= 6) {
                linePositionsX.forEach(posX => {
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.position.set(posX, 0.03, z);
                    roadGroup.add(line);
                    roadLines.push(line);
                });
            }

            scene.add(roadGroup);
        }

        function createPlayerCar() {
            playerMesh = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(1.6, 0.5, 3.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, roughness: 0.3, metalness: 0.4 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.4;
            bodyMesh.castShadow = true;
            playerMesh.add(bodyMesh);

            const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0088cc, roughness: 0.3 });
            const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
            cabinMesh.position.set(0, 0.8, -0.2);
            cabinMesh.castShadow = true;
            playerMesh.add(cabinMesh);

            const glassGeo = new THREE.BoxGeometry(1.25, 0.45, 1.5);
            const glassMat = new THREE.MeshPhongMaterial({ color: 0x112233, transparent: true, opacity: 0.85 });
            const glassMesh = new THREE.Mesh(glassGeo, glassMat);
            glassMesh.position.set(0, 0.82, -0.2);
            playerMesh.add(glassMesh);

            const lightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xfff0a0 });
            const lightL = new THREE.Mesh(lightGeo, lightMat);
            lightL.position.set(-0.55, 0.45, -1.56);
            const lightR = lightL.clone();
            lightR.position.x = 0.55;
            playerMesh.add(lightL, lightR);

            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2200 });
            const tailL = new THREE.Mesh(lightGeo, tailMat);
            tailL.position.set(-0.55, 0.45, 1.56);
            const tailR = tailL.clone();
            tailR.position.x = 0.55;
            playerMesh.add(tailL, tailR);

            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.25, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
            const rimMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0 });
            
            const wheelPositions = [
                [-0.85, 0.3, -1.0], [0.85, 0.3, -1.0],
                [-0.85, 0.3, 1.0], [0.85, 0.3, 1.0]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.26, 8), rimMat);
                rim.rotation.z = Math.PI / 2;
                rim.position.set(...pos);
                
                playerMesh.add(wheel, rim);
            });

            playerMesh.position.set(LANE_X[currentLane], 0, 0);
            scene.add(playerMesh);
        }

        function createObstacleMesh(colorHex) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.5, 0.8, 2.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            group.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.2, 0.55, 1.3);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.05, 0.1);
            group.add(cabin);

            return group;
        }

        function createSideObstacleMesh(subType) {
            const group = new THREE.Group();
            
            if (subType === 'pedestrian') {
                const matBody = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
                const matPants = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });
                const matSkin = new THREE.MeshStandardMaterial({ color: 0xfed7aa, roughness: 0.4 });

                const torsoGeo = new THREE.BoxGeometry(0.5, 0.7, 0.3);
                const torso = new THREE.Mesh(torsoGeo, matBody);
                torso.position.y = 0.85;
                torso.castShadow = true;
                group.add(torso);

                const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
                const head = new THREE.Mesh(headGeo, matSkin);
                head.position.y = 1.4;
                head.castShadow = true;
                group.add(head);

                const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
                const legL = new THREE.Mesh(legGeo, matPants);
                legL.position.set(-0.13, 0.25, 0);
                const legR = new THREE.Mesh(legGeo, matPants);
                legR.position.set(0.13, 0.25, 0);
                group.add(legL, legR);
                group.legs = [legL, legR];

            } else if (subType === 'bird') {
                const matFeather = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
                const matBeak = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 });

                const bodyGeo = new THREE.ConeGeometry(0.3, 0.9, 5);
                const body = new THREE.Mesh(bodyGeo, matFeather);
                body.rotation.x = Math.PI / 2;
                body.position.y = 1.5;
                group.add(body);

                const wingGeo = new THREE.BoxGeometry(0.9, 0.05, 0.4);
                const wingL = new THREE.Mesh(wingGeo, matFeather);
                wingL.position.set(-0.45, 1.55, 0);
                const wingR = new THREE.Mesh(wingGeo, matFeather);
                wingR.position.set(0.45, 1.55, 0);
                group.add(wingL, wingR);
                group.wings = [wingL, wingR];

                const beakGeo = new THREE.ConeGeometry(0.1, 0.25, 4);
                const beak = new THREE.Mesh(beakGeo, matBeak);
                beak.rotation.x = Math.PI / 2;
                beak.position.set(0, 1.5, -0.5);
                group.add(beak);

            } else if (subType === 'deer') {
                const matFur = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 });
                const matAntler = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 });

                const deerBodyGroup = new THREE.Group();
                deerBodyGroup.scale.set(1.4, 1.4, 1.4);

                const bodyGeo = new THREE.BoxGeometry(0.65, 0.65, 1.2);
                const body = new THREE.Mesh(bodyGeo, matFur);
                body.position.y = 0.8;
                body.castShadow = true;
                deerBodyGroup.add(body);

                const neckGeo = new THREE.BoxGeometry(0.35, 0.7, 0.35);
                const neck = new THREE.Mesh(neckGeo, matFur);
                neck.position.set(0, 1.25, -0.45);
                neck.rotation.x = -Math.PI / 6;
                deerBodyGroup.add(neck);

                const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.5);
                const head = new THREE.Mesh(headGeo, matFur);
                head.position.set(0, 1.55, -0.65);
                deerBodyGroup.add(head);

                const antlerMainGeo = new THREE.BoxGeometry(0.06, 0.45, 0.06);
                const antlerLeft = new THREE.Mesh(antlerMainGeo, matAntler);
                antlerLeft.position.set(-0.18, 1.8, -0.6);
                antlerLeft.rotation.z = -Math.PI / 8;
                const antlerRight = new THREE.Mesh(antlerMainGeo, matAntler);
                antlerRight.position.set(0.18, 1.8, -0.6);
                antlerRight.rotation.z = Math.PI / 8;
                deerBodyGroup.add(antlerLeft, antlerRight);

                const legGeo = new THREE.BoxGeometry(0.14, 0.55, 0.14);
                const legFL = new THREE.Mesh(legGeo, matFur);
                legFL.position.set(-0.22, 0.28, -0.4);
                const legFR = new THREE.Mesh(legGeo, matFur);
                legFR.position.set(0.22, 0.28, -0.4);
                const legBL = new THREE.Mesh(legGeo, matFur);
                legBL.position.set(-0.22, 0.28, 0.4);
                const legBR = new THREE.Mesh(legGeo, matFur);
                legBR.position.set(0.22, 0.28, 0.4);

                deerBodyGroup.add(legFL, legFR, legBL, legBR);
                group.add(deerBodyGroup);
                group.legs = [legFL, legFR, legBL, legBR];
            }

            return group;
        }

        function createRoadHoleMesh() {
            const group = new THREE.Group();
            const holeGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.06, 24);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x020617 });
            const hole = new THREE.Mesh(holeGeo, holeMat);
            hole.position.y = 0.04;
            group.add(hole);

            const coneGeo = new THREE.ConeGeometry(0.25, 0.6, 12);
            const coneMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3 });
            const conePositions = [[-0.8, 0], [0.8, 0], [0, -0.8], [0, 0.8]];

            conePositions.forEach(pos => {
                const cone = new THREE.Mesh(coneGeo, coneMat);
                cone.position.set(pos[0], 0.3, pos[1]);
                cone.castShadow = true;
                group.add(cone);
            });

            return group;
        }

        function createFuelMesh() {
            const group = new THREE.Group();
            const canGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16);
            const canMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2, metalness: 0.6, emissive: 0x047857, emissiveIntensity: 0.3 });
            const canister = new THREE.Mesh(canGeo, canMat);
            canister.position.y = 0.8;
            canister.castShadow = true;
            group.add(canister);

            const ringGeo = new THREE.TorusGeometry(0.8, 0.08, 16, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.1;
            group.add(ring);

            return group;
        }

        function moveLeft() {
            if (gameState !== 'PLAYING') return;
            if (currentLane > 0) {
                currentLane--;
                targetX = LANE_X[currentLane];
            }
        }

        function moveRight() {
            if (gameState !== 'PLAYING') return;
            if (currentLane < 4) {
                currentLane++;
                targetX = LANE_X[currentLane];
            }
        }

        function resetGame() {
            currentLane = 2;
            targetX = LANE_X[currentLane];
            playerMesh.position.set(targetX, 0, 0);
            playerMesh.rotation.z = 0;

            fuel = MAX_FUEL;
            score = 0;
            elapsedTime = 0;
            currentSpeedMultiplier = 1;

            obstacles.forEach(o => scene.remove(o.mesh));
            fuelItems.forEach(f => scene.remove(f.mesh));

            obstacles = [];
            fuelItems = [];
            obstacleSpawnTimer = 0;
            pedestrianSpawnTimer = 0;
            fuelSpawnTimer = 0;

            updateUI();
        }

        function spawnEntities(deltaTime) {
            obstacleSpawnTimer += deltaTime;
            pedestrianSpawnTimer += deltaTime;
            fuelSpawnTimer += deltaTime;

            const minObstacleInterval = Math.max(0.25, (1.2 - (elapsedTime / 60) * 0.7));
            if (obstacleSpawnTimer > minObstacleInterval) {
                obstacleSpawnTimer = 0;
                const lane = Math.floor(Math.random() * 5);
                const colors = [0xef4444, 0xf59e0b, 0x8b5cf6, 0x10b981, 0xec4899];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const mesh = createObstacleMesh(color);
                mesh.position.set(LANE_X[lane], 0, -55);
                scene.add(mesh);

                obstacles.push({
                    type: 'car',
                    mesh: mesh,
                    lane: lane,
                    vx: 0
                });
            }

            if (elapsedTime >= 30.0 && Math.random() < 0.015) {
                const holeLane = Math.floor(Math.random() * 5);
                const isOccupied = obstacles.some(o => Math.abs(o.mesh.position.z - (-55)) < 6 && Math.abs(o.mesh.position.x - LANE_X[holeLane]) < 1);
                if (!isOccupied) {
                    const holeMesh = createRoadHoleMesh();
                    holeMesh.position.set(LANE_X[holeLane], 0, -55);
                    scene.add(holeMesh);

                    obstacles.push({
                        type: 'roadHole',
                        subType: 'hole',
                        mesh: holeMesh,
                        vx: 0
                    });
                }
            }

            const minPedestrianInterval = Math.max(0.7, 1.4 - (elapsedTime / 60) * 0.5);
            if (pedestrianSpawnTimer > minPedestrianInterval) {
                pedestrianSpawnTimer = 0;
                const fromLeft = Math.random() < 0.5;
                const startX = fromLeft ? -8.5 : 8.5;
                const dir = fromLeft ? 1 : -1;
                
                const types = ['deer', 'pedestrian', 'deer', 'bird'];
                const subType = types[Math.floor(Math.random() * types.length)];
                let speedVal = (3.5 + Math.random() * 2) * dir;
                
                const mesh = createSideObstacleMesh(subType);
                mesh.position.set(startX, 0.8, -55);
                scene.add(mesh);

                obstacles.push({
                    type: 'crossing',
                    subType: subType,
                    mesh: mesh,
                    vx: speedVal
                });
            }

            const fuelInterval = 0.95;
            if (fuelSpawnTimer > fuelInterval) {
                fuelSpawnTimer = 0;
                const lane = Math.floor(Math.random() * 5);
                const mesh = createFuelMesh();
                mesh.position.set(LANE_X[lane], 0, -55);
                scene.add(mesh);

                fuelItems.push({
                    mesh: mesh,
                    lane: lane
                });
            }
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
            lastTimestamp = timestamp;

            elapsedTime += deltaTime;
            currentSpeedMultiplier = 1 + Math.min(1.5, (elapsedTime / 60) * 1.5);
            const currentSpeed3D = baseSpeed * 3.5 * currentSpeedMultiplier;

            // Fuel depletion at -0.5s/sec
            fuel -= deltaTime * 0.5;
            score += deltaTime * 100;

            if (fuel <= 0) {
                gameOver('연료가 모두 고갈되었습니다!');
                return;
            }

            const diffX = targetX - playerMesh.position.x;
            playerMesh.position.x += diffX * 0.22;
            playerMesh.rotation.z = -diffX * 0.1;

            roadLines.forEach(line => {
                line.position.z += currentSpeed3D * deltaTime;
                if (line.position.z > 10) {
                    line.position.z -= ROAD_LENGTH - 10;
                }
            });

            spawnEntities(deltaTime);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += currentSpeed3D * deltaTime;

                if (obs.type === 'crossing') {
                    obs.mesh.position.x += obs.vx * deltaTime;
                    obs.mesh.rotation.y = obs.vx > 0 ? Math.PI / 2 : -Math.PI / 2;
                }

                const dx = Math.abs(obs.mesh.position.x - playerMesh.position.x);
                const dz = Math.abs(obs.mesh.position.z - playerMesh.position.z);

                const collisionThresholdX = obs.type === 'roadHole' ? 1.0 : 1.3;
                const collisionThresholdZ = obs.type === 'roadHole' ? 1.4 : 2.2;

                if (dx < collisionThresholdX && dz < collisionThresholdZ) {
                    sfx.playCrash();
                    let reasonText = '장애물과 충돌했습니다!';
                    if (obs.type === 'roadHole') {
                        reasonText = '도로 공사 구멍(싱크홀)에 빠졌습니다!';
                    } else if (obs.type === 'crossing') {
                        if (obs.subType === 'bird') reasonText = '새와 충돌했습니다!';
                        else if (obs.subType === 'deer') reasonText = '고라니와 충돌했습니다!';
                        else reasonText = '보행자와 충돌했습니다!';
                    }
                    gameOver(reasonText);
                    return;
                }

                if (obs.mesh.position.z > 15 || Math.abs(obs.mesh.position.x) > 14) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            for (let i = fuelItems.length - 1; i >= 0; i--) {
                const item = fuelItems[i];
                item.mesh.position.z += currentSpeed3D * deltaTime;
                item.mesh.rotation.y += deltaTime * 3.0;

                const dx = Math.abs(item.mesh.position.x - playerMesh.position.x);
                const dz = Math.abs(item.mesh.position.z - playerMesh.position.z);

                if (dx < 1.4 && dz < 1.8) {
                    fuel = Math.min(MAX_FUEL, fuel + 1.0);
                    triggerFuelRecoveryEffect();
                    scene.remove(item.mesh);
                    fuelItems.splice(i, 1);
                    continue;
                }

                if (item.mesh.position.z > 15) {
                    scene.remove(item.mesh);
                    fuelItems.splice(i, 1);
                }
            }

            updateUI();
            renderer.render(scene, camera);
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            scoreDisplay.textContent = Math.floor(score).toLocaleString();
            speedDisplay.textContent = `속도: ${Math.floor(100 * currentSpeedMultiplier)} km/h`;
            
            const fuelPercent = Math.max(0, (fuel / MAX_FUEL) * 100);
            fuelBar.style.width = `${fuelPercent}%`;
            fuelText.textContent = `${Math.max(0, fuel).toFixed(1)}초`;

            if (fuel < 3.0) {
                fuelBar.classList.remove('from-emerald-500', 'to-green-400');
                fuelBar.classList.add('bg-rose-500');
            } else {
                fuelBar.classList.remove('bg-rose-500');
                fuelBar.classList.add('from-emerald-500', 'to-green-400');
            }
        }

        function triggerFuelRecoveryEffect() {
            sfx.playFuel();
            screenFlash.style.opacity = '1';
            setTimeout(() => { screenFlash.style.opacity = '0'; }, 150);
        }

        function startGame() {
            sfx.init();
            resetGame();
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
            lastTimestamp = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver(reason) {
            gameState = 'GAMEOVER';
            overlay.classList.remove('hidden');
            titleContainer.classList.add('hidden');
            rulesCard.classList.add('hidden');
            resultBox.classList.remove('hidden');

            gameOverReason.textContent = reason;
            finalScore.textContent = Math.floor(score).toLocaleString();
            startBtn.textContent = '다시 도전하기';
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                moveLeft();
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                moveRight();
            }
        });

        btnLeft.addEventListener('click', moveLeft);
        btnRight.addEventListener('click', moveRight);
        startBtn.addEventListener('click', startGame);

        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
